<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270"
     role="img" aria-label="Bar chart of the wait before each retry: 0.25, 0.5, 1, 2, 4 and 8 seconds, each with a lighter band showing plus or minus 20 percent of jitter, and a dashed line marking the 8 second cap.">
  <!-- ⚠️ The card is painted rather than left transparent: the reader chooses
       the paper this sits on, and a diagram drawn in dark ink on nothing
       disappears entirely on a dark one. -->
  <rect width="720" height="270" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="719" height="269" rx="13.5" fill="none" stroke="#E2E2E2"/>

  <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="600" fill="#1A1A1A">How long the client waits before each retry</text>
  <text x="28" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" fill="#606060">initialDelay 0.25 s · factor 2 · maximumDelay 8 s · jitter ±20%</text>

  <!-- The 8 second ceiling. -->
  <line x1="60" y1="90" x2="660" y2="90" stroke="#A01B1B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="664" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#A01B1B">cap</text>

  <line x1="60" y1="210.5" x2="660" y2="210.5" stroke="#C9C9C9" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#404040" text-anchor="middle">
    <rect x="70" y="194.0" width="60" height="16.0" rx="3" fill="#0B5D45"/>
    <rect x="70" y="187.9" width="60" height="12.2" rx="3" fill="#0B5D45" opacity="0.30"/>
    <text x="100" y="230">0.25 s</text>
    <rect x="170" y="173.2" width="60" height="36.8" rx="3" fill="#0B5D45"/>
    <rect x="170" y="167.1" width="60" height="12.2" rx="3" fill="#0B5D45" opacity="0.30"/>
    <text x="200" y="230">0.5 s</text>
    <rect x="270" y="152.4" width="60" height="57.6" rx="3" fill="#0B5D45"/>
    <rect x="270" y="146.3" width="60" height="12.2" rx="3" fill="#0B5D45" opacity="0.30"/>
    <text x="300" y="230">1 s</text>
    <rect x="370" y="131.6" width="60" height="78.4" rx="3" fill="#0B5D45"/>
    <rect x="370" y="125.5" width="60" height="12.2" rx="3" fill="#0B5D45" opacity="0.30"/>
    <text x="400" y="230">2 s</text>
    <rect x="470" y="110.8" width="60" height="99.2" rx="3" fill="#0B5D45"/>
    <rect x="470" y="104.7" width="60" height="12.2" rx="3" fill="#0B5D45" opacity="0.30"/>
    <text x="500" y="230">4 s</text>
    <rect x="570" y="90.0" width="60" height="120.0" rx="3" fill="#0B5D45"/>
    <rect x="570" y="83.9" width="60" height="12.2" rx="3" fill="#0B5D45" opacity="0.30"/>
    <text x="600" y="230">8 s</text>
  </g>

  <text x="28" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" fill="#707070">The pale band on each bar is the jitter — the reason two clients backing off together do not come back together.</text>
</svg>
